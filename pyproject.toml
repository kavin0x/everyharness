[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everyharness"
version = "0.1.0"
description = "Offline-first CLI + TUI for running any dropped-in model via pluggable harnesses"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "kavin0x" }]
keywords = ["ml", "models", "harness", "cli", "plugins"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "textual>=0.80",
    "rich>=13.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "packaging>=24.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
llm = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "huggingface-hub>=0.24",
]
tabular = [
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
embeddings = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
vision = [
    "pillow>=10.0",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
speech = []
# Whisper is not pinned here: openai-whisper pulls numba/llvmlite incompatible with 3.11+.
# Install manually when needed: pip install openai-whisper
speech-whisper = []
diffusion = [
    "diffusers>=0.30",
    "torch>=2.0",
    "pillow>=10.0",
]
computer = []
train = [
    "scikit-learn>=1.4",
    "joblib>=1.3",
]
all = [
    "everyharness[llm,tabular,vision,speech,diffusion,computer,train,embeddings]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
everyharness = "everyharness.cli:app"

[project.entry-points."everyharness.harnesses"]
generic = "everyharness.harnesses.generic:GenericHarness"
tabular = "everyharness.harnesses.tabular:TabularHarness"
embeddings = "everyharness.harnesses.embeddings:EmbeddingsHarness"
llm = "everyharness.harnesses.llm:LLMHarness"
vision = "everyharness.harnesses.vision:VisionHarness"
speech = "everyharness.harnesses.speech:SpeechHarness"
diffusion = "everyharness.harnesses.diffusion:DiffusionHarness"
computer = "everyharness.harnesses.computer:ComputerHarness"

[project.entry-points."everyharness.loaders"]
local = "everyharness.loaders.local:LocalLoader"
huggingface = "everyharness.loaders.hf:HuggingFaceLoader"
ollama = "everyharness.loaders.ollama:OllamaLoader"
callable = "everyharness.loaders.callable_loader:CallableLoader"

[project.entry-points."everyharness.detectors"]
builtin = "everyharness.core.detect:BuiltinDetector"

[project.entry-points."everyharness.templates"]
cli-stub = "everyharness.templates.cli_stub:CliStubTemplatePack"

[project.urls]
Homepage = "https://github.com/kavin0x/everyharness"
Documentation = "https://github.com/kavin0x/everyharness#readme"
Repository = "https://github.com/kavin0x/everyharness"
Issues = "https://github.com/kavin0x/everyharness/issues"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/everyharness"]

[tool.hatch.build.targets.sdist]
include = ["src/everyharness", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["everyharness"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "peft",
    "peft.*",
    "llama_cpp",
    "llama_cpp.*",
    "onnxruntime",
    "onnxruntime.*",
    "whisper",
    "whisper.*",
    "joblib",
    "joblib.*",
    "sklearn",
    "sklearn.*",
    "diffusers",
    "diffusers.*",
    "sentence_transformers.losses",
]
ignore_missing_imports = true
